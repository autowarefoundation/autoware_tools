[develop]
script_dir=$base/lib/simulator_compatibility_test
[install]
install_scripts=$base/lib/simulator_compatibility_test
[tool:pytest]
# launch_testing 3.4.12 and 3.4.13 on Jazzy override norecursedirs: https://github.com/ros2/launch/issues/1047
addopts = -p no:launch_ros -p no:launch_testing
norecursedirs = test_base test_morai_sim test_sim_common_manual_testing
